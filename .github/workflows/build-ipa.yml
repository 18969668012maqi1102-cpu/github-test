name: Build IPA (TrollStore)

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ main ]

permissions:
  contents: write          # 发布 Release 所需（创建 IPA 资产）

jobs:
  build:
    name: Build unsigned IPA for TrollStore
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: .
        run: xcodegen generate

      - name: Build app (no signing)
        working-directory: .
        run: |
          set -e
          xcodebuild -scheme TodoAttendance -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build/DerivedData \
            build

      - name: Install ldid (fake signer)
        run: |
          set -e
          # ldid 做 ad-hoc 伪签名。TrollStore 安装时会用伪造根证书重签，
          # 并保留这里预签的 entitlements（我们不需要额外权限，故用空签名）。
          # ProcursusTeam 的 release 提供各平台单文件二进制，按架构选。
          ARCH=$(uname -m)
          case "$ARCH" in
            arm64) ASSET="ldid_macosx_arm64" ;;
            *)     ASSET="ldid_macosx_x86_64" ;;
          esac
          TAG="v2.1.5-procursus7"
          URL="https://github.com/ProcursusTeam/ldid/releases/download/${TAG}/${ASSET}"
          echo "Downloading $URL"
          curl -fsSL -o ldid "$URL"
          file ldid
          chmod +x ldid
          sudo mv ./ldid /usr/local/bin/ldid
          ldid 2>&1 | head -3 || true

      - name: Fakesign & package IPA
        working-directory: .
        run: |
          set -e
          APP=$(find build/DerivedData/Build/Products -name 'TodoAttendance.app' -type d -maxdepth 3 | head -1)
          echo "Found app: $APP"
          test -n "$APP"

          # 伪签名主二进制
          ldid -S "$APP/TodoAttendance"

          # 处理内嵌 framework / dylib（若有）
          find "$APP" -name "*.framework" -type d -maxdepth 4 2>/dev/null | while read -r fw; do
            BIN="$fw/$(basename "$fw" .framework)"
            if [ -f "$BIN" ]; then ldid -S "$BIN" || true; fi
          done
          find "$APP" -name "*.dylib" -type f 2>/dev/null | while read -r dylib; do
            ldid -S "$dylib" || true
          done

          # 构造标准 IPA 结构：Payload/<App>.app
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry ../TodoAttendance.ipa Payload
          cd ..
          ls -lh TodoAttendance.ipa
          echo "--- IPA 结构 ---"
          unzip -l TodoAttendance.ipa | head -25

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoAttendance-ipa
          path: TodoAttendance.ipa
          retention-days: 30

      # 同时发布到 Release：可直接下载，无需登录，便于传到手机安装
      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TodoAttendance ${{ github.run_number }}
          draft: false
          prerelease: false
          body: |
            待办考勤 iOS App（TrollStore 安装版）

            - 设备要求：iOS 14.0 – 16.6.1 / 17.0（需已安装 TrollStore）
            - 安装：下载 `TodoAttendance.ipa` → 传到手机 → 用 TrollStore 打开安装
            - 数据存放在服务端，App 本身不存业务数据
          files:
            - TodoAttendance.ipa
